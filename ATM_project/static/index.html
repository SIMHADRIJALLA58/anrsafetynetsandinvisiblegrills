<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ATM System</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f0f0f0; }
    h1, h2 { text-align: center; }
    input { display: block; width: 100%; padding: 8px; margin: 10px 0; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    p { color: green; }
  </style>
</head>
<body>
  <h1>ATM System</h1>

  <h2>Register</h2>
  <input id="reg_name" placeholder="Name">
  <input id="reg_pin" placeholder="PIN" type="password">
  <button onclick="register()">Register</button>
  <p id="reg_msg"></p>

  <h2>Login</h2>
  <input id="login_acc" placeholder="Account Number">
  <input id="login_pin" placeholder="PIN" type="password">
  <button onclick="login()">Login</button>
  <p id="login_msg"></p>

  <script src="app.js"></script>
</body>
</html>
